# Deploys the reading service so nobody pastes SQL or uses the dashboard.
# Edge functions deploy on every push to main that touches them (a redeploy
# undoes a bad one). Database migrations only run when started by hand,
# because they change production data.
# Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# Optional repo secret GEMINI_API_KEY is copied into the function secrets on each deploy (dream images).
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
    inputs:
      migrate:
        description: Also apply pending database migrations
        type: boolean
        default: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # DreamPattern project. Never the Brady Remodeling project.
  PROJECT_REF: cvezzeawnyogurkaejau

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: inputs.migrate
        run: supabase db push --include-all

      - name: Set the Gemini key for dream images
        if: env.GEMINI_API_KEY != ''
        run: supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$PROJECT_REF" --yes

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --yes
